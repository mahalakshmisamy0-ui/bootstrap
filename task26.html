<!DOCTYPE html>
<html>
<head>
    <title>Font Family Example</title>

    <style>
        .arial {
            font-family: Arial, sans-serif;
        }

        .times {
            font-family: "Times New Roman", serif;
        }

        .verdana {
            font-family: Verdana, sans-serif;
        }
    </style>
</head>

<body>

    <h1>Different Font Families</h1>

    <p class="arial">
        This paragraph uses the Arial font family.
    </p>

    <p class="times">
        This paragraph uses the Times New Roman font family.
    </p>

    <p class="verdana">
        This paragraph uses the Verdana font family.
    </p>

</body>
</html>
