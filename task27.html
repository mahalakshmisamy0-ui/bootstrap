<!DOCTYPE html>
<html>
<head>
    <title>Font Properties</title>

    <style>
        /* font-size */
        .large-text {
            font-size: 30px;
        }

        /* font-weight */
        .bold-text {
            font-weight: bold;
        }

        /* font-style */
        .italic-text {
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1>CSS Font Properties</h1>

    <p class="large-text">
        This paragraph demonstrates the font-size property.
    </p>

    <p class="bold-text">
        This paragraph demonstrates the font-weight property.
    </p>

    <p class="italic-text">
        This paragraph demonstrates the font-style property.
    </p>

</body>
</html>
