<!DOCTYPE html>
<html>
<head>
    <title>Text Properties</title>

    <style>
        /* text-transform */
        .transform {
            text-transform: uppercase;
        }

        /* text-decoration */
        .decoration {
            text-decoration: underline;
        }

        /* letter-spacing */
        .spacing {
            letter-spacing: 5px;
        }
    </style>
</head>

<body>

    <h1>CSS Text Properties</h1>

    <p class="transform">
        This paragraph demonstrates text-transform.
    </p>

    <p class="decoration">
        This paragraph demonstrates text-decoration.
    </p>

    <p class="spacing">
        This paragraph demonstrates letter-spacing.
    </p>

</body>
</html>
