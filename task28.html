<!DOCTYPE html>
<html>
<head>
    <title>Google Font and System Font</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* Headings use Google Font */
        h1, h2 {
            font-family: 'Poppins', sans-serif;
        }

        /* Paragraphs use a system font */
        p {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<body>

    <h1>Google Font Heading</h1>

    <h2>Using Poppins Font</h2>

    <p>
        This paragraph uses a system font such as Arial.
        System fonts are already available on most computers.
    </p>

    <p>
        The headings use the Google Font Poppins, while the
        paragraphs use the system font Arial.
    </p>

</body>
</html>
